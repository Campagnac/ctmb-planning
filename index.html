<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning du CTMB</title>
<style>
  :root {
    --bg: #EEF1EE;
    --surface: #FFFFFF;
    --surface-sunken: #F5F7F5;
    --ink: #17231F;
    --ink-soft: #55655F;
    --ink-faint: #8B9993;
    --border: #DBE1DD;
    --border-strong: #B9C3BE;

    --admin: #3A3F3D;
    --admin-soft: #E7E7E5;
    --admin-line: #C7C8C5;

    --presentiel: #2B6E63;
    --presentiel-soft: #E3EEEC;
    --presentiel-line: #BBD4CF;

    --tele: #B0701F;
    --tele-soft: #F6EAD8;
    --tele-line: #E5C79A;

    --nurse: #3D5A80;
    --nurse-soft: #E4E9F1;
    --nurse-line: #C0CCDD;

    --locked: #C9CFCB;
    --locked-soft: #F0F2F0;
    --closed-hatch: #E3E6E2;

    --radius: 10px;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 20px 14px 40px;
    min-height: 100vh;
  }

  .app { max-width: 780px; margin: 0 auto; }

  header.top {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  header.top .logo {
    height: 48px;
    width: auto;
    flex-shrink: 0;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 28px;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
  }

  /* Role switch */
  .role-switch {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    margin: 16px 0 18px;
    gap: 3px;
  }
  .role-switch button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 10px;
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .role-switch button .dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.5;
  }
  .role-switch button.active[data-role="admin"] { background: var(--admin); color: #fff; }
  .role-switch button.active[data-role="medecin"] { background: var(--presentiel); color: #fff; }
  .role-switch button.active[data-role="infirmiere"] { background: var(--nurse); color: #fff; }
  .role-switch button.active .dot { opacity: 1; }
  .role-switch button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Admin: slot manager */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 14px 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 12px;
  }
  .slot-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .slot-row:last-of-type { border-bottom: none; }
  .slot-row .label { font-weight: 600; flex: 1; }
  .slot-row .time { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .slot-row .del {
    border: none; background: var(--locked-soft); color: var(--ink-soft);
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .slot-row .del:hover { background: var(--locked); color: #fff; }
  .slot-row .edit {
    border: none; background: var(--locked-soft); color: var(--ink-soft);
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .slot-row .edit:hover { background: var(--admin); color: #fff; }
  .slot-row.editing {
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 10px 0;
  }
  .slot-row.editing input[type="text"] {
    flex: 1 1 120px;
    font-family: var(--font-body);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 7px 8px;
    font-size: 13px;
    background: var(--surface-sunken);
  }
  .slot-row.editing input[type="time"] {
    flex: 0 0 96px;
    font-family: var(--font-body);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 7px 8px;
    font-size: 13px;
    background: var(--surface-sunken);
  }
  .slot-row.editing .save-slot {
    border: none; background: var(--admin); color: #fff;
    padding: 7px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .slot-row.editing .cancel-slot {
    border: none; background: transparent; color: var(--ink-faint);
    padding: 7px 6px; font-size: 12px; cursor: pointer;
  }

  .slot-form {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
  }
  .slot-form input {
    font-family: var(--font-body);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 9px;
    font-size: 13px;
    background: var(--surface-sunken);
  }
  .slot-form input[type="text"] { flex: 1 1 130px; }
  .slot-form input[type="time"] { flex: 0 0 100px; }
  .slot-form button {
    border: none; background: var(--admin); color: #fff;
    padding: 8px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .slot-form button:disabled { opacity: 0.4; cursor: not-allowed; }
  .empty-note { font-size: 12.5px; color: var(--ink-faint); padding: 4px 0; }

  .admin-hint {
    font-size: 12px; color: var(--ink-soft); margin: -6px 0 14px; padding: 0 2px;
  }

  .bulk-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .bulk-toolbar .msg { font-size: 12.5px; color: var(--ink-soft); }
  .bulk-toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bulk-toolbar button {
    border: none; border-radius: 7px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .bulk-toolbar .toggle-on { background: var(--presentiel); color: #fff; }
  .bulk-toolbar .toggle-off { background: var(--surface-sunken); color: var(--ink); border: 1px solid var(--border); }
  .bulk-toolbar .apply { background: var(--presentiel); color: #fff; }
  .bulk-toolbar .apply:disabled { background: var(--locked); cursor: not-allowed; }
  .bulk-toolbar .cancel-sel { background: transparent; color: var(--ink-faint); text-decoration: underline; }

  .cell.selected-multi {
    box-shadow: inset 0 0 0 2px var(--presentiel);
    background: var(--presentiel-soft);
  }
  .select-check {
    position: absolute; top: 5px; right: 5px;
    width: 14px; height: 14px; border-radius: 4px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: #fff;
  }
  .cell.selected-multi .select-check { background: var(--presentiel); border-color: var(--presentiel); }

  /* Month nav */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 8px;
    margin-bottom: 14px;
  }
  .month-nav button {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:hover { background: var(--border); }
  .month-nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .month-label {
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: capitalize;
    color: var(--ink);
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* Calendar */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .weekdays div {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding-bottom: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cell-empty { visibility: hidden; }

  .cell {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 66px;
    padding: 7px 7px 8px;
    cursor: pointer;
    text-align: left;
    font-family: var(--font-body);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cell:hover { box-shadow: 0 2px 6px rgba(23,35,31,0.08); }
  .cell:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cell .num {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
  }
  .cell.today .num {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
  }

  .badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 5px;
    border-radius: 4px;
    align-self: flex-start;
  }

  /* admin closed days */
  .cell.closed {
    background: repeating-linear-gradient(135deg, var(--closed-hatch), var(--closed-hatch) 4px, var(--surface) 4px, var(--surface) 8px);
  }
  .cell.closed .badge { background: var(--locked); color: #fff; }

  /* locked (medecin: closed by admin / infirmiere: no tele slot) */
  .cell.locked {
    cursor: not-allowed;
    background: var(--locked-soft);
  }
  .cell.locked .num { color: var(--ink-faint); }
  .cell.locked:hover { box-shadow: none; }
  .lock-icon { position: absolute; top: 6px; right: 6px; font-size: 10px; color: var(--locked); }

  .slot-dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .slot-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--border-strong); }
  .slot-dot.presentiel { background: var(--presentiel); }
  .slot-dot.teleconsultation { background: var(--tele); }
  .slot-dot.nurse-ring { box-shadow: 0 0 0 2px var(--nurse); }

  /* Stats footer */
  .stats { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat .n { font-family: var(--font-mono); font-size: 20px; color: var(--ink); }
  .stat .l { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(23,35,31,0.35); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  @media (min-width: 520px) { .overlay { align-items: center; } }
  .modal { background: var(--surface); width: 100%; max-width: 400px; max-height: 86vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px 20px 22px; box-shadow: 0 -4px 24px rgba(0,0,0,0.15); }
  @media (min-width: 520px) { .modal { border-radius: 14px; } }
  .modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 0 0 3px; text-transform: capitalize; }
  .modal .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }

  .slot-assign { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .slot-assign .name { font-size: 13.5px; font-weight: 700; margin-bottom: 1px; }
  .slot-assign .time { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); margin-bottom: 8px; }
  .assign-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .assign-btns button {
    flex: 1; min-width: 90px; border: 1px solid var(--border); background: var(--surface-sunken);
    padding: 8px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .assign-btns button.sel[data-t="presentiel"] { background: var(--presentiel); border-color: var(--presentiel); color: #fff; }
  .assign-btns button.sel[data-t="teleconsultation"] { background: var(--tele); border-color: var(--tele); color: #fff; }
  .assign-btns button.sel[data-t="clear"] { background: var(--locked); border-color: var(--locked); color: #fff; }
  .assign-btns button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .nurse-slot { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nurse-slot .name { font-size: 13.5px; font-weight: 700; }
  .nurse-slot .time { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); }
  .nurse-slot button { border: none; background: var(--nurse); color: #fff; padding: 8px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .nurse-slot button.off { background: var(--locked-soft); color: var(--ink-soft); }

  .modal .cancel { width: 100%; text-align: center; padding: 11px; border-radius: 9px; border: none; background: transparent; font-size: 13px; color: var(--ink-faint); cursor: pointer; margin-top: 4px; }

  .pw-input { width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; font-size: 14px; margin-bottom: 8px; font-family: var(--font-body); background: var(--surface-sunken); }
  .pw-input:focus-visible { outline: 2px solid var(--admin); outline-offset: 1px; }
  .pw-error { color: #B23A3A; font-size: 12px; margin: -2px 0 8px; }
  .primary-btn { width: 100%; border: none; background: var(--admin); color: #fff; padding: 12px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 6px; }
  .primary-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; }
  .link-btn { border: none; background: transparent; color: var(--admin); font-size: 11.5px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 60; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .status-line { font-size: 12px; color: var(--ink-faint); text-align: center; margin-top: 16px; }
</style>
</head>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const STORAGE_KEY = 'garde-schedule';
  const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const DEFAULT_SLOT = { id: 'jour', label: 'Journée complète', start: '', end: '' };

  let role = 'medecin';
  let current = new Date();
  current.setDate(1);

  // data model
  let slots = [];                 // [{id,label,start,end}]
  let openDays = {};               // { "YYYY-MM-DD": false }  (absence = open)
  let schedule = {};               // { "YYYY-MM": { "D": { [slotId]: {type, nurse} } } }
  let adminHash = null;            // SHA-256 hex of the admin password, or null if not set yet
  let adminAuthenticated = false;  // session-only; reset on reload
  let editingSlotId = null;        // id of the slot currently being edited inline, or null
  let multiSelectMode = false;     // médecin: bulk-editing several days at once
  let selectedDays = new Set();    // day numbers (in current month) selected for bulk edit

  async function sha256Hex(str) {
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const grid = document.getElementById('grid');
  const monthLabel = document.getElementById('monthLabel');
  const legend = document.getElementById('legend');
  const adminHint = document.getElementById('adminHint');
  const bulkToolbar = document.getElementById('bulkToolbar');
  const adminPanel = document.getElementById('adminPanel');
  const statsEl = document.getElementById('stats');
  const statusLine = document.getElementById('statusLine');
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const toastEl = document.getElementById('toast');

  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function dateKey(d, day) { return monthKey(d) + '-' + String(day).padStart(2, '0'); }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  async function load() {
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      const parsed = res && res.value ? JSON.parse(res.value) : {};
      slots = Array.isArray(parsed.slots) ? parsed.slots : [];
      openDays = parsed.openDays || {};
      schedule = parsed.schedule || {};
      adminHash = parsed.adminHash || null;
      migrateOldFormat(parsed);
    } catch (e) {
      slots = []; openDays = {}; schedule = {};
    }
    if (slots.length === 0) slots = [
      { id: 'matin', label: 'Matin', start: '08:00', end: '14:00' },
      { id: 'apres-midi', label: 'Après-midi', start: '14:00', end: '20:00' }
    ];
    statusLine.textContent = 'Les données sont partagées entre les trois entrées (admin / médecin / infirmière).';
    render();
  }

  // migrate the earlier day-level {type, nurse} format into slot-based format
  function migrateOldFormat(parsed) {
    if (parsed.slots) return; // already new format
    const oldSchedule = parsed && !parsed.schedule && Object.keys(parsed).length ? parsed : null;
    const src = schedule && Object.keys(schedule).length ? schedule : (typeof parsed === 'object' && !parsed.schedule ? parsed : null);
    if (!src) return;
    const migrated = {};
    Object.keys(src).forEach(mKey => {
      const monthObj = src[mKey];
      if (!monthObj || typeof monthObj !== 'object') return;
      migrated[mKey] = {};
      Object.keys(monthObj).forEach(day => {
        const v = monthObj[day];
        if (v && v.type && !v[DEFAULT_SLOT.id] && (v.type === 'presentiel' || v.type === 'teleconsultation')) {
          migrated[mKey][day] = { [DEFAULT_SLOT.id]: { type: v.type, nurse: !!v.nurse } };
        } else {
          migrated[mKey][day] = v;
        }
      });
    });
    schedule = migrated;
  }

  async function save() {
    try {
      const payload = JSON.stringify({ slots, openDays, schedule, adminHash });
      const result = await window.storage.set(STORAGE_KEY, payload, true);
      if (!result) showToast("Échec de l'enregistrement — réessayez.");
    } catch (e) {
      showToast("Échec de l'enregistrement — réessayez.");
    }
  }

  function isOpen(d, day) { return openDays[dateKey(d, day)] !== false; }
  function toggleOpen(d, day) {
    const k = dateKey(d, day);
    const nowOpen = isOpen(d, day);
    if (nowOpen) openDays[k] = false; else delete openDays[k];
    save(); render();
  }

  function daySlots(d, day) {
    const k = monthKey(d);
    return (schedule[k] && schedule[k][day]) || {};
  }
  function setSlotAssignment(d, day, slotId, data) {
    setSlotAssignmentSilent(d, day, slotId, data);
    save(); render();
  }
  function setSlotAssignmentSilent(d, day, slotId, data) {
    const k = monthKey(d);
    if (!schedule[k]) schedule[k] = {};
    if (!schedule[k][day]) schedule[k][day] = {};
    if (data === null) delete schedule[k][day][slotId];
    else schedule[k][day][slotId] = data;
  }

  function closeModal() { overlay.classList.remove('open'); modal.innerHTML = ''; }

  /* ---------- Admin panel ---------- */
  function renderAdminPanel() {
    if (role !== 'admin') { adminPanel.innerHTML = ''; return; }
    adminPanel.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <h2>Créneaux horaires</h2>
          <button class="link-btn" id="changePwBtn">Changer le mot de passe</button>
        </div>
        <div id="slotList"></div>
        <div class="slot-form">
          <input type="text" id="newLabel" placeholder="Libellé (ex. Matin)" maxlength="30">
          <input type="time" id="newStart">
          <input type="time" id="newEnd">
          <button id="addSlot">Ajouter</button>
        </div>
      </div>
    `;
    const list = document.getElementById('slotList');
    if (slots.length === 0) {
      list.innerHTML = `<div class="empty-note">Aucun créneau défini pour l'instant.</div>`;
    } else {
      list.innerHTML = slots.map(s => {
        if (s.id === editingSlotId) {
          return `
            <div class="slot-row editing" data-id="${s.id}">
              <input type="text" class="edit-label" value="${escapeHtml(s.label)}" maxlength="30">
              <input type="time" class="edit-start" value="${s.start || ''}">
              <input type="time" class="edit-end" value="${s.end || ''}">
              <button class="save-slot">Enregistrer</button>
              <button class="cancel-slot">Annuler</button>
            </div>
          `;
        }
        return `
        <div class="slot-row">
          <span class="label">${escapeHtml(s.label)}</span>
          <span class="time">${s.start || '—'}${s.end ? ' – ' + s.end : ''}</span>
          <button class="edit" data-id="${s.id}" aria-label="Modifier ce créneau">✎</button>
          <button class="del" data-id="${s.id}" aria-label="Supprimer ce créneau">×</button>
        </div>
      `;
      }).join('');
      list.querySelectorAll('.del').forEach(btn => {
        btn.onclick = () => {
          slots = slots.filter(s => s.id !== btn.dataset.id);
          save(); renderAdminPanel(); render();
        };
      });
      list.querySelectorAll('.edit').forEach(btn => {
        btn.onclick = () => {
          editingSlotId = btn.dataset.id;
          renderAdminPanel();
        };
      });
      const editingRow = list.querySelector('.slot-row.editing');
      if (editingRow) {
        editingRow.querySelector('.save-slot').onclick = () => {
          const id = editingRow.dataset.id;
          const label = editingRow.querySelector('.edit-label').value.trim();
          const start = editingRow.querySelector('.edit-start').value;
          const end = editingRow.querySelector('.edit-end').value;
          if (!label) { showToast('Indiquez un libellé pour le créneau.'); return; }
          const slot = slots.find(s => s.id === id);
          if (slot) { slot.label = label; slot.start = start; slot.end = end; }
          editingSlotId = null;
          save(); renderAdminPanel(); render();
        };
        editingRow.querySelector('.cancel-slot').onclick = () => {
          editingSlotId = null;
          renderAdminPanel();
        };
      }
    }
    document.getElementById('addSlot').onclick = () => {
      const label = document.getElementById('newLabel').value.trim();
      const start = document.getElementById('newStart').value;
      const end = document.getElementById('newEnd').value;
      if (!label) { showToast('Indiquez un libellé pour le créneau.'); return; }
      slots.push({ id: 'slot-' + Date.now(), label, start, end });
      save(); renderAdminPanel(); render();
    };
    document.getElementById('changePwBtn').onclick = openChangePasswordModal;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- Admin auth ---------- */
  function openAdminAuthModal(btn) {
    if (!adminHash) {
      modal.innerHTML = `
        <h2>Créer un accès administrateur</h2>
        <div class="sub">Définissez un mot de passe pour protéger la configuration (jours, créneaux).</div>
        <input type="password" class="pw-input" id="pw1" placeholder="Mot de passe (4 caractères min.)" autocomplete="new-password">
        <input type="password" class="pw-input" id="pw2" placeholder="Confirmer le mot de passe" autocomplete="new-password">
        <div class="pw-error" id="pwError" style="display:none"></div>
        <button class="primary-btn" id="pwSubmit">Définir et continuer</button>
        <button class="cancel" id="cancelBtn">Annuler</button>
      `;
      overlay.classList.add('open');
      document.getElementById('pwSubmit').onclick = async () => {
        const p1 = document.getElementById('pw1').value;
        const p2 = document.getElementById('pw2').value;
        const err = document.getElementById('pwError');
        if (p1.length < 4) { err.textContent = 'Le mot de passe doit faire au moins 4 caractères.'; err.style.display = 'block'; return; }
        if (p1 !== p2) { err.textContent = 'Les mots de passe ne correspondent pas.'; err.style.display = 'block'; return; }
        adminHash = await sha256Hex(p1);
        adminAuthenticated = true;
        save();
        closeModal();
        applyRole(btn);
      };
      document.getElementById('cancelBtn').onclick = closeModal;
    } else {
      modal.innerHTML = `
        <h2>Accès administrateur</h2>
        <div class="sub">Saisissez le mot de passe administrateur.</div>
        <input type="password" class="pw-input" id="pwLogin" placeholder="Mot de passe" autocomplete="current-password">
        <div class="pw-error" id="pwError" style="display:none"></div>
        <button class="primary-btn" id="pwSubmit">Valider</button>
        <button class="cancel" id="cancelBtn">Annuler</button>
      `;
      overlay.classList.add('open');
      const submit = async () => {
        const p = document.getElementById('pwLogin').value;
        const h = await sha256Hex(p);
        if (h === adminHash) {
          adminAuthenticated = true;
          closeModal();
          applyRole(btn);
        } else {
          const err = document.getElementById('pwError');
          err.textContent = 'Mot de passe incorrect.';
          err.style.display = 'block';
        }
      };
      document.getElementById('pwSubmit').onclick = submit;
      document.getElementById('pwLogin').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      document.getElementById('cancelBtn').onclick = closeModal;
    }
  }

  function openChangePasswordModal() {
    modal.innerHTML = `
      <h2>Changer le mot de passe</h2>
      <div class="sub">Confirmez le mot de passe actuel puis choisissez-en un nouveau.</div>
      <input type="password" class="pw-input" id="pwCurrent" placeholder="Mot de passe actuel" autocomplete="current-password">
      <input type="password" class="pw-input" id="pwNew1" placeholder="Nouveau mot de passe" autocomplete="new-password">
      <input type="password" class="pw-input" id="pwNew2" placeholder="Confirmer le nouveau mot de passe" autocomplete="new-password">
      <div class="pw-error" id="pwError" style="display:none"></div>
      <button class="primary-btn" id="pwSubmit">Mettre à jour</button>
      <button class="cancel" id="cancelBtn">Annuler</button>
    `;
    overlay.classList.add('open');
    document.getElementById('pwSubmit').onclick = async () => {
      const cur = document.getElementById('pwCurrent').value;
      const n1 = document.getElementById('pwNew1').value;
      const n2 = document.getElementById('pwNew2').value;
      const err = document.getElementById('pwError');
      const curHash = await sha256Hex(cur);
      if (curHash !== adminHash) { err.textContent = 'Mot de passe actuel incorrect.'; err.style.display = 'block'; return; }
      if (n1.length < 4) { err.textContent = 'Le nouveau mot de passe doit faire au moins 4 caractères.'; err.style.display = 'block'; return; }
      if (n1 !== n2) { err.textContent = 'Les nouveaux mots de passe ne correspondent pas.'; err.style.display = 'block'; return; }
      adminHash = await sha256Hex(n1);
      save();
      closeModal();
      showToast('Mot de passe mis à jour.');
    };
    document.getElementById('cancelBtn').onclick = closeModal;
  }

  /* ---------- Modals ---------- */
  function openAdminDayModal(d, day) {
    const open = isOpen(d, day);
    const label = new Date(d.getFullYear(), d.getMonth(), day).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    modal.innerHTML = `
      <h2>${label}</h2>
      <div class="sub">Disponibilité de ce jour pour le médecin</div>
      <div class="assign-btns" style="margin-bottom:10px">
        <button id="setOpen" class="${open ? 'sel' : ''}" data-t="presentiel">Jour ouvert</button>
        <button id="setClosed" class="${!open ? 'sel' : ''}" data-t="clear">Jour fermé</button>
      </div>
      <button class="cancel" id="cancelBtn">Fermer</button>
    `;
    overlay.classList.add('open');
    document.getElementById('setOpen').onclick = () => { if (!open) toggleOpen(d, day); closeModal(); };
    document.getElementById('setClosed').onclick = () => { if (open) toggleOpen(d, day); closeModal(); };
    document.getElementById('cancelBtn').onclick = closeModal;
  }

  function openDoctorModal(d, day) {
    const label = new Date(d.getFullYear(), d.getMonth(), day).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const assigned = daySlots(d, day);
    modal.innerHTML = `<h2>${label}</h2><div class="sub">Attribuer un mode par créneau</div>` +
      slots.map(s => {
        const a = assigned[s.id];
        const t = a ? a.type : null;
        return `
        <div class="slot-assign">
          <div class="name">${escapeHtml(s.label)}</div>
          <div class="time">${s.start || '—'}${s.end ? ' – ' + s.end : ''}</div>
          <div class="assign-btns" data-slot="${s.id}">
            <button data-t="presentiel" class="${t === 'presentiel' ? 'sel' : ''}">Présentiel</button>
            <button data-t="teleconsultation" class="${t === 'teleconsultation' ? 'sel' : ''}">Télécons. assistée</button>
            <button data-t="clear" class="${!t ? 'sel' : ''}">Effacer</button>
          </div>
        </div>`;
      }).join('') +
      `<button class="cancel" id="cancelBtn">Fermer</button>`;
    overlay.classList.add('open');
    modal.querySelectorAll('.assign-btns').forEach(group => {
      const slotId = group.dataset.slot;
      group.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          const t = btn.dataset.t;
          if (t === 'clear') {
            setSlotAssignment(d, day, slotId, null);
          } else {
            const prev = daySlots(d, day)[slotId];
            const nurse = t === 'teleconsultation' && prev ? !!prev.nurse : false;
            setSlotAssignment(d, day, slotId, { type: t, nurse });
          }
          closeModal();
        };
      });
    });
    document.getElementById('cancelBtn').onclick = closeModal;
  }

  function openDoctorBulkModal(days) {
    const sorted = [...days].sort((a, b) => a - b);
    const label = sorted.length + ' jour' + (sorted.length > 1 ? 's' : '') + ' sélectionné' + (sorted.length > 1 ? 's' : '') + ' — ' + MOIS[current.getMonth()];
    modal.innerHTML = `<h2>Modifier plusieurs jours</h2><div class="sub">${label} : ${sorted.join(', ')}</div>` +
      slots.map(s => `
        <div class="slot-assign">
          <div class="name">${escapeHtml(s.label)}</div>
          <div class="time">${s.start || '—'}${s.end ? ' – ' + s.end : ''}</div>
          <div class="assign-btns" data-slot="${s.id}">
            <button data-t="presentiel">Présentiel</button>
            <button data-t="teleconsultation">Télécons. assistée</button>
            <button data-t="clear">Effacer</button>
          </div>
        </div>`).join('') +
      `<button class="cancel" id="cancelBtn">Annuler</button>`;
    overlay.classList.add('open');
    modal.querySelectorAll('.assign-btns').forEach(group => {
      const slotId = group.dataset.slot;
      group.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          const t = btn.dataset.t;
          sorted.forEach(day => {
            if (t === 'clear') {
              setSlotAssignmentSilent(current, day, slotId, null);
            } else {
              const prev = daySlots(current, day)[slotId];
              const nurse = t === 'teleconsultation' && prev ? !!prev.nurse : false;
              setSlotAssignmentSilent(current, day, slotId, { type: t, nurse });
            }
          });
          save();
          closeModal();
          selectedDays.clear();
          multiSelectMode = false;
          showToast(`Appliqué à ${sorted.length} jour${sorted.length > 1 ? 's' : ''}.`);
          render();
        };
      });
    });
    document.getElementById('cancelBtn').onclick = closeModal;
  }
    const label = new Date(d.getFullYear(), d.getMonth(), day).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const assigned = daySlots(d, day);
    const teleSlots = slots.filter(s => assigned[s.id] && assigned[s.id].type === 'teleconsultation');
    modal.innerHTML = `<h2>${label}</h2><div class="sub">Créneaux en téléconsultation assistée</div>` +
      teleSlots.map(s => {
        const a = assigned[s.id];
        const on = !!a.nurse;
        return `
        <div class="nurse-slot">
          <div>
            <div class="name">${escapeHtml(s.label)}</div>
            <div class="time">${s.start || '—'}${s.end ? ' – ' + s.end : ''}</div>
          </div>
          <button data-slot="${s.id}" class="${on ? '' : 'off'}">${on ? 'Retirer' : 'Se positionner'}</button>
        </div>`;
      }).join('') +
      `<button class="cancel" id="cancelBtn">Fermer</button>`;
    overlay.classList.add('open');
    modal.querySelectorAll('.nurse-slot button').forEach(btn => {
      btn.onclick = () => {
        const slotId = btn.dataset.slot;
        const a = daySlots(d, day)[slotId];
        setSlotAssignment(d, day, slotId, { type: 'teleconsultation', nurse: !a.nurse });
        closeModal();
      };
    });
    document.getElementById('cancelBtn').onclick = closeModal;
  }

  function onCellClick(day) {
    if (role === 'admin') {
      openAdminDayModal(current, day);
      return;
    }
    const open = isOpen(current, day);
    if (!open) { showToast("Jour fermé par l'administrateur."); return; }
    if (role === 'medecin') {
      if (slots.length === 0) { showToast("Aucun créneau horaire défini — contactez l'administrateur."); return; }
      if (multiSelectMode) {
        if (selectedDays.has(day)) selectedDays.delete(day); else selectedDays.add(day);
        render();
        return;
      }
      openDoctorModal(current, day);
    } else {
      const assigned = daySlots(current, day);
      const hasTele = slots.some(s => assigned[s.id] && assigned[s.id].type === 'teleconsultation');
      if (hasTele) openNurseModal(current, day);
      else showToast("Jour verrouillé — aucun créneau en téléconsultation assistée.");
    }
  }

  /* ---------- Bulk edit toolbar (médecin) ---------- */
  function renderBulkToolbar() {
    if (role !== 'medecin') { bulkToolbar.innerHTML = ''; return; }
    if (!multiSelectMode) {
      bulkToolbar.innerHTML = `
        <div class="bulk-toolbar">
          <span class="msg">Besoin de modifier plusieurs jours à la fois ?</span>
          <div class="actions"><button class="toggle-off" id="startMulti">Sélection multiple</button></div>
        </div>
      `;
      document.getElementById('startMulti').onclick = () => {
        multiSelectMode = true;
        selectedDays.clear();
        render();
      };
    } else {
      const n = selectedDays.size;
      bulkToolbar.innerHTML = `
        <div class="bulk-toolbar">
          <span class="msg">${n} jour${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''} — cliquez sur les jours ouverts à inclure.</span>
          <div class="actions">
            <button class="apply" id="applyMulti" ${n === 0 ? 'disabled' : ''}>Appliquer</button>
            <button class="cancel-sel" id="cancelMulti">Annuler</button>
          </div>
        </div>
      `;
      document.getElementById('applyMulti').onclick = () => {
        if (selectedDays.size === 0) return;
        openDoctorBulkModal(selectedDays);
      };
      document.getElementById('cancelMulti').onclick = () => {
        multiSelectMode = false;
        selectedDays.clear();
        render();
      };
    }
  }

  /* ---------- Legend / stats / grid ---------- */
  function renderLegend() {
    if (role === 'admin') {
      legend.innerHTML = `
        <div class="item"><span class="swatch" style="background:var(--surface);border:1px solid var(--border)"></span>Jour ouvert</div>
        <div class="item"><span class="swatch" style="background:var(--closed-hatch)"></span>Jour fermé</div>
      `;
      adminHint.textContent = "Cliquez un jour pour l'ouvrir ou le fermer à la sélection du médecin. Gérez les créneaux horaires ci-dessus.";
    } else if (role === 'medecin') {
      legend.innerHTML = `
        <div class="item"><span class="swatch" style="background:var(--presentiel)"></span>Présentiel</div>
        <div class="item"><span class="swatch" style="background:var(--tele)"></span>Téléconsultation assistée</div>
        <div class="item"><span class="swatch" style="background:var(--closed-hatch)"></span>Jour fermé (admin)</div>
      `;
      adminHint.textContent = '';
    } else {
      legend.innerHTML = `
        <div class="item"><span class="swatch" style="background:var(--tele)"></span>Téléconsultation assistée</div>
        <div class="item"><span class="swatch" style="background:var(--nurse)"></span>Vous êtes positionnée</div>
        <div class="item"><span class="swatch" style="background:var(--locked)"></span>Verrouillé</div>
      `;
      adminHint.textContent = '';
    }
  }

  function renderStats() {
    const k = monthKey(current);
    const month = schedule[k] || {};
    let pres = 0, tele = 0, nurse = 0, closedDays = 0;
    Object.values(month).forEach(day => {
      Object.values(day).forEach(v => {
        if (v.type === 'presentiel') pres++;
        if (v.type === 'teleconsultation') { tele++; if (v.nurse) nurse++; }
      });
    });
    const daysInMonth = new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) if (!isOpen(current, d)) closedDays++;
    statsEl.innerHTML = `
      <div class="stat"><div class="n">${pres}</div><div class="l">Créneaux présentiel</div></div>
      <div class="stat"><div class="n">${tele}</div><div class="l">Créneaux téléconsultation</div></div>
      <div class="stat"><div class="n">${nurse} / ${tele}</div><div class="l">Couverts par l'infirmière</div></div>
      <div class="stat"><div class="n">${closedDays}</div><div class="l">Jours fermés ce mois-ci</div></div>
    `;
  }

  function render() {
    renderAdminPanel();
    monthLabel.textContent = MOIS[current.getMonth()] + ' ' + current.getFullYear();
    renderLegend();
    renderBulkToolbar();
    renderStats();

    grid.innerHTML = '';
    const year = current.getFullYear(), month = current.getMonth();
    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = new Date().toDateString();

    for (let i = 0; i < startOffset; i++) {
      const e = document.createElement('div');
      e.className = 'cell cell-empty';
      grid.appendChild(e);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      const open = isOpen(current, day);
      const assigned = daySlots(current, day);
      const isToday = new Date(year, month, day).toDateString() === todayStr;

      let cls = 'cell';
      let inner = `<span class="num">${day}</span>`;

      if (role === 'admin') {
        if (!open) { cls += ' closed'; inner += `<span class="badge">Fermé</span>`; }
      } else if (role === 'medecin') {
        if (!open) {
          cls += ' locked';
          inner += `<span class="lock-icon">🔒</span>`;
        } else {
          const dots = slots.map(s => {
            const a = assigned[s.id];
            const t = a ? a.type : '';
            return `<span class="slot-dot ${t}"></span>`;
          }).join('');
          inner += `<div class="slot-dots">${dots}</div>`;
          if (multiSelectMode) {
            if (selectedDays.has(day)) cls += ' selected-multi';
            inner += `<span class="select-check">${selectedDays.has(day) ? '✓' : ''}</span>`;
          }
        }
      } else {
        const hasTele = slots.some(s => assigned[s.id] && assigned[s.id].type === 'teleconsultation');
        if (!open || !hasTele) {
          cls += ' locked';
          inner += `<span class="lock-icon">🔒</span>`;
        } else {
          const dots = slots.map(s => {
            const a = assigned[s.id];
            if (!a || a.type !== 'teleconsultation') return `<span class="slot-dot"></span>`;
            return `<span class="slot-dot teleconsultation${a.nurse ? ' nurse-ring' : ''}"></span>`;
          }).join('');
          inner += `<div class="slot-dots">${dots}</div>`;
        }
      }
      if (isToday) cls += ' today';

      btn.className = cls;
      btn.innerHTML = inner;
      btn.setAttribute('aria-label', `${day}${isToday ? " (aujourd'hui)" : ''}`);
      btn.onclick = () => onCellClick(day);
      grid.appendChild(btn);
    }
  }

  function applyRole(btn) {
    role = btn.dataset.role;
    multiSelectMode = false;
    selectedDays.clear();
    document.querySelectorAll('.role-switch button').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
    });
    render();
  }

  document.querySelectorAll('.role-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.role === 'admin' && !adminAuthenticated) {
        openAdminAuthModal(btn);
        return;
      }
      applyRole(btn);
    });
  });
  document.querySelector('.role-switch button[data-role="medecin"]').classList.add('active');

  document.getElementById('prevMonth').onclick = () => { current.setMonth(current.getMonth() - 1); selectedDays.clear(); render(); };
  document.getElementById('nextMonth').onclick = () => { current.setMonth(current.getMonth() + 1); selectedDays.clear(); render(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  load();
})();
</script>
</body>
</html>
